<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iOS Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calculator">
    <h1>iOS Calculator</h1>

    <section class="display" aria-live="polite">
      <div class="expression" id="expression"></div>
      <output class="result" id="result">0</output>
    </section>

    <div class="keys" id="keys">
      <button class="key utility" data-type="clear">AC</button>
      <button class="key" data-type="digit" data-value="00">00</button>
      <button class="key" data-type="percent" aria-label="percent">%</button>
      <button class="key operator" data-type="operator" data-value="/" aria-label="divide">&divide;</button>

      <button class="key" data-type="digit" data-value="7">7</button>
      <button class="key" data-type="digit" data-value="8">8</button>
      <button class="key" data-type="digit" data-value="9">9</button>
      <button class="key operator" data-type="operator" data-value="*" aria-label="multiply">&times;</button>

      <button class="key" data-type="digit" data-value="4">4</button>
      <button class="key" data-type="digit" data-value="5">5</button>
      <button class="key" data-type="digit" data-value="6">6</button>
      <button class="key operator" data-type="operator" data-value="-" aria-label="subtract">&minus;</button>

      <button class="key" data-type="digit" data-value="1">1</button>
      <button class="key" data-type="digit" data-value="2">2</button>
      <button class="key" data-type="digit" data-value="3">3</button>
      <button class="key operator" data-type="operator" data-value="+" aria-label="add">+</button>

      <button class="key zero" data-type="digit" data-value="0">0</button>
      <button class="key" data-type="decimal" aria-label="decimal point">.</button>
      <button class="key operator" data-type="equals" aria-label="equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
